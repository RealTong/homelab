apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  annotations:
    glance/icon: di:alertmanager
    glance/name: "Alertmanager"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        # bump to roll the pod when the config changes
        checksum/config: "telegram-v1"
    spec:
      # Keep Alertmanager off the control-plane node so it can still notify
      # when realtong-server (single API server) is down.
      affinity:
        nodeAffinity:
          # Prefer k3s-agent-1. k3s-agent-2 is an OrbStack VM on a Mac that may
          # sleep, which would silently stop alert delivery. Still avoid the control
          # plane (realtong-server) so a frozen server doesn't take alerting down.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k3s-agent-1"]
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: telegram-token
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: telegram-token
          secret:
            secretName: alertmanager-telegram
            defaultMode: 0444
            items:
              - key: token
                path: token
        - name: data
          emptyDir: {}
