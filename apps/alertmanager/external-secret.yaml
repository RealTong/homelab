apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: observability
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
  data:
    - secretKey: token
      remoteRef:
        key: Telegram/BOT_TOKEN
