apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    # No notification receiver is configured yet (decision pending).
    # Alerts are visible in the Alertmanager / Prometheus UIs only.
    # To notify the existing Flux Telegram chat, add a Secret with the bot
    # token (e.g. ExternalSecret from 1Password item Telegram/BOT_TOKEN),
    # mount it, and replace the "null" receiver with:
    #   - name: telegram
    #     telegram_configs:
    #       - bot_token_file: /etc/alertmanager/secrets/token
    #         chat_id: <chat id>
    #         send_resolved: true
    route:
      receiver: "null"
      group_by: ["alertname", "namespace", "node"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"
