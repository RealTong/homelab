apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest
  namespace: homelab
  annotations:
    glance/icon: simple-icons:openai
    glance/name: "Manifest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manifest
  template:
    metadata:
      labels:
        app: manifest
    spec:
      containers:
        - name: manifest
          image: manifestdotbuild/manifest:6.28.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: manifest-secret
          env:
            - name: PORT
              value: "3001"
            - name: BIND_ADDRESS
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
            - name: MANIFEST_MODE
              value: cloud
            - name: AUTO_MIGRATE
              value: "true"
            - name: SEED_DATA
              value: "false"
            # 6.28.9 cloud post-deploy backfill logs "A direct PostgreSQL URL
            # is required…" every 30s unless MIGRATION_DATABASE_URL,
            # DATABASE_UNPOOLED_URL, or BACKFILL_DATABASE_URL is set
            # (resolveRequestBackfillDatabaseUrl). In-cluster postgres is
            # already direct, so reuse DATABASE_URL.
            - name: BACKFILL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: manifest-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
