apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: homelab
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: cloudflared-token
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: CloudFlare/TUNNEL_TOKEN
