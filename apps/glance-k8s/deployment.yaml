apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance-k8s
  namespace: observability
spec:
  selector:
    matchLabels:
      app: glance-k8s
  template:
    metadata:
      labels:
        app: glance-k8s
    spec:
      serviceAccountName: glance-k8s
      containers:
      - name: glance-k8s
        image: ghcr.io/lukasdietrich/glance-k8s/glance-k8s:v0.5.8
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            # 100m CPU limit throttled the process enough that 1s probes timed
            # out (700+ liveness failures). Allow bursts and give probes slack.
            cpu: "500m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          timeoutSeconds: 5
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          timeoutSeconds: 5
