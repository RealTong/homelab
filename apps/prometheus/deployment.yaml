apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  annotations:
    glance/icon: di:prometheus
    glance/name: "Prometheus"
spec:
  # One writer on the shared NFS TSDB: stop the old pod before starting the new
  # one (the default surge crash-looped on the TSDB lock during the #289 move).
  # Same effect as Recreate, without the SSA type switch that the defaulted
  # rollingUpdate field blocks.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # subPath ConfigMap mounts are not live-updated; bump to restart on config/rule changes
        checksum/config: "alerting-v3"
    spec:
      # Rules are evaluated here. Prefer a worker so a frozen control plane
      # (realtong-server) does not take the alert path down with it. The TSDB
      # PVC is nfs-client ReadWriteMany, so the pod can move.
      affinity:
        nodeAffinity:
          # Prefer k3s-agent-1. k3s-agent-2 is an OrbStack VM on a Mac that may
          # sleep, which would silently stop rule evaluation. Still avoid the control
          # plane (realtong-server) so a frozen server doesn't take alerting down.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k3s-agent-1"]
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          image: prom/prometheus:v3.15.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: tmp-volume
              mountPath: /tmp
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-pvc
        - name: prometheus-config
          configMap:
            name: prometheus-configmap
            items:
            - key: prometheus.yml
              path: prometheus.yml
        - name: tmp-volume
          emptyDir: {}
        - name: prometheus-rules
          configMap:
            name: prometheus-rules
