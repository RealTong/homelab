apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-store
spec:
  provider:
    onepasswordSDK:
      vault: Homelab
      # Cache 1Password item lookups to avoid SDK-provider rate limiting across
      # the cluster's many hourly ExternalSecret reconciliations.
      cache:
        ttl: 15m
        maxSize: 100
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account-token
          key: token
          namespace: external-secrets
