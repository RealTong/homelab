apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: external-secrets
      # Pinned; Renovate bumps it. NOTE: onepassword-sdk-go v0.4.1 (all ESO
      # releases up to 2.13.0) can wedge its shared WASM core after a transient
      # DNS/network error -> every ExternalSecret fails with "wasm error: out of
      # bounds memory access" until the controller pod restarts.
      # Upstream: external-secrets#6941, onepassword-sdk-go#288.
      version: "2.13.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  values:
    # Normal usage is ~200Mi; the wedged SDK leaks memory (seen at 2.7Gi).
    # The limit makes the kubelet OOM-kill and restart a leaking controller,
    # which also resets the broken 1Password WASM core.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 768Mi
