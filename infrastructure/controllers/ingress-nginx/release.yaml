apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: default
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.x"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      replicaCount: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: controller
                    app.kubernetes.io/instance: nginx-ingress
                    app.kubernetes.io/name: ingress-nginx
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: nginx-ingress
              app.kubernetes.io/name: ingress-nginx
      service:
        type: LoadBalancer
        loadBalancerIP: 10.0.0.145
        externalTrafficPolicy: Local
      extraArgs:
        default-ssl-certificate: default/realtong-cn-wildcard-tls
      config:
        custom-http-errors: "404,500,502,503,504"
        enable-underscores-in-headers: "true"
    defaultBackend:
      enabled: true
      image:
        registry: ghcr.io
        image: tarampampam/error-pages
        tag: "4.2.7"
      extraVolumeMounts:
        - name: error-pages-templates
          mountPath: /opt/error-pages
          readOnly: true
      extraVolumes:
        - name: error-pages-templates
          configMap:
            name: ingress-nginx-error-pages-templates
      # error-pages v4: ADD_TEMPLATE/TEMPLATE_NAME -> HTML_TEMPLATE (a custom template
      # replaces the built-ins), RESPONSE_PLAINTEXT_FORMAT -> TEXT_TEMPLATE (old names
      # are silently ignored), template fields use v4 syntax ({{ .StatusCode }} etc.).
      # See https://github.com/tarampampam/error-pages/blob/master/docs/UPGRADE_TO_V4.md
      extraEnvs:
        - name: HTML_TEMPLATE
          value: /opt/error-pages/lost-in-space-realtong.html
        - name: SHOW_DETAILS
          value: "true"
        - name: SEND_SAME_HTTP_CODE
          value: "true"
        - name: TEXT_TEMPLATE
          value: |-
            Error {{ .StatusCode }}: {{ .Message }}
            {{ .Description }}
            {{- if .Host }}

            Host: {{ .Host }}{{ end }}{{- if .OriginalURI }}
            Original URI: {{ .OriginalURI }}{{ end }}{{- if .ForwardedFor }}
            来源 IP: {{ index (fields (replace "," " " .ForwardedFor)) 0 }}{{ end }}{{- if .RequestID }}
            Request ID: {{ .RequestID }}{{ end }}
